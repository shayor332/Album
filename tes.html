<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-4">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tawaran">tampilkan tawaran</button>
    </div>

    <div class="modal" id="tawaran">
        <div class="modal-dialog">
            <div class="modal-content">
                
                <div class="modal-header">
                    <h5 class="modal-title text-primary">Beli Laptop/Komponen Lain di PS</h5>
                    <button type="button" class="btn-close btn-close-primary" data-bs-dismiss="modal"></button>
                </div> 
                <div class="modal-body">
                    <p class="text-danger">selamat datang di isekai</p>
                </div>
                  <div class="modal-footer">
                    <button class="btn btn-primary" data-bs-dismiss="modal">Tutup</button>
                    <button class="btn btn-success" data-bs-dismiss="modal">Simpan</button>
                  </div>
            </div>
        </div>
    </div>
</body>
</html>
