<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container bg-warning mt-3 rounded-4">
        <h3 CLASS="text-center text-primary">FORMULIR PENDAFTARAN SISWA BARU</h3>
        <div class="mb-3 form-floating">
            <input type="text" placeholder="masukkan NIPD" class="form-control">
            <label>NIPD</label> 
        </div>
        <div class="mb-3 form-floating">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
            <label>Nama Lengkap</label>
        </div>
        <div class="mb-3 form-floating">
            <input type="text" placeholder="Email" class="form-control">
            <label>Email</label>
        </div>
        <div class="mb-3 form-floating">
            <textarea class="form-control" placeholder="Alamat Lengkap"></textarea>
            <label>Alamat Lengkap</label>
        </div>
        <div class="mb-3 form-floating">
            <select class="form-select">
                <option disabled selected hidden>Pilih Jurusan</option>
                <option>Rekayasa Perangkat Lunak</option>
                <option>Teknik Komputer Dan Jaringan</option>
                <option>Desain Komunikasi Visual</option>
                <option>Akuntasi</option>
                <option>Bisnis Digital</option>
            </select>
            <label>Pilih Jurusan</label>
        </div>
        <div class="mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Volly</label>
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Pramuka</label>
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Natbinari</label>
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul PMR</label>
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Paskibra</label>
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Futsal</label>
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Badminton</label>
        </div>
        <div>
            <div class="row">
                <div class="col-1">
                    <input class="form-check-input" type="radio" name="jk">
                    <label class="form-check-label">Laki-Laki</label>
                </div>
                <div class="col-6">
                    <input class="form-check-input" type="radio" name="jk">
                    <label class="form-check-label">Perempuan</label>
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-danger" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="untuk simpan data">SIMPAN DATA</button>
        <button class="btn btn-success">HAPUS DATA</button>
    </div>
</body>
</html>
