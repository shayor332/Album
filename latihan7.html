<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="container mt-2">
    <div id="slideAutoPlaying" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="rounded mx-auto d-block w-100" src="https://images6.alphacoders.com/129/thumb-1920-1297089.png" alt="...">
            </div>
            <div class="carousel-item">
                <img class="rounded mx-auto d-block w-100" src="https://images2.alphacoders.com/132/thumb-1920-1325097.png" alt="...">
            </div>
            <div class="carousel-item">
                <img class="rounded mx-auto d-block w-100" src="https://wallpapercave.com/wp/wp12027042.jpg" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#slideAutoPlaying" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#slideAutoPlaying" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden"></span>
        </button>
    </div>
</div>
</body>
</html>
